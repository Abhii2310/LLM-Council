name: Deploy Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-predeploy-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Start backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/quantum/status >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log || true
          exit 1

      - name: Run predeploy checks (read-only)
        run: python scripts/predeploy_check.py --base-url http://127.0.0.1:8000 --no-feedback-write

      - name: Show backend logs on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend-build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
